
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور | Freelancer Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">F</div>
                <h1>Freelancer</h1>
            </div>

            <div class="auth-heading">
                <h2>بازیابی رمز عبور</h2>
                <p>
                    ایمیلی که با آن ثبت‌نام کردی رو وارد کن.
                    لینک بازیابی رمز عبور برات ایجاد می‌شه.
                </p>
            </div>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">آدرس ایمیل</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div id="forgotMessage" class="message" hidden></div>

                <button type="submit" class="submit-btn" id="forgotButton">
                    ارسال لینک بازیابی
                </button>

            </form>

            <div class="auth-footer">
                رمز عبورت رو به یاد آوردی؟
                <a href="index.html">بازگشت به ورود</a>
            </div>

        </section>

        <footer class="page-footer">
            Freelancer Marketplace
        </footer>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
