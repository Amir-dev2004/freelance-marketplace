
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز عبور | Freelancer Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">F</div>
                <h1>Freelancer</h1>
            </div>

            <div class="auth-heading">
                <h2>تعیین رمز عبور جدید</h2>
                <p>
                    رمز عبور جدیدت رو وارد کن و برای تأیید،
                    یک بار دیگه اون رو تکرار کن.
                </p>
            </div>

            <form id="resetPasswordForm">

                <div class="form-group">
                    <label for="newPassword">رمز عبور جدید</label>

                    <div class="password-input">
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="رمز عبور جدید"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="newPassword"
                            aria-label="نمایش رمز عبور"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">تکرار رمز عبور جدید</label>

                    <div class="password-input">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="تکرار رمز عبور جدید"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="نمایش رمز عبور"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="resetMessage" class="message" hidden></div>

                <button type="submit" class="submit-btn" id="resetButton">
                    ذخیره رمز عبور جدید
                </button>

            </form>

            <div class="auth-footer">
                <a href="index.html">بازگشت به صفحه ورود</a>
            </div>

        </section>

        <footer class="page-footer">
            Freelancer Marketplace
        </footer>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
