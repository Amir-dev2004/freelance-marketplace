<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | Freelancer Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-container">
        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">F</div>
                <h1>Freelancer</h1>
            </div>

            <div class="auth-heading">
                <h2>سایت فریلنسر</h2>
                <p>برای ورود به حساب کاربری خود اطلاعاتت رو وارد کن.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">ایمیل</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <div class="password-label">
                        <label for="password">رمز عبور</label>
                        <a href="forgot-password.html">فراموشی رمز عبور؟</a>
                    </div>

                    <div class="password-input">
                        <input type="password" id="password" name="password" placeholder="رمز عبورت رو وارد کن"
                            autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="نمایش رمز عبور">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="message error" hidden></div>

                <button type="submit" class="submit-btn" id="loginButton">
                    ورود به حساب
                </button>

            </form>

            <div class="auth-footer">
                حساب کاربری نداری؟
                <a href="signup.html">ثبت‌نام کن</a>
            </div>

        </section>

        <footer class="page-footer">
            Freelancer Marketplace
        </footer>
    </main>

    <script src="js/auth.js"></script>
</body>

</html>
